# BadMatch 生产环境部署
# 只需这一个文件 + .env 即可启动
# docker compose -f docker-compose.prod.yml up -d

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: badminton
      POSTGRES_PASSWORD: ${DB_PASSWORD:-badminton}
      POSTGRES_DB: badminton
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    restart: always

  server:
    image: hsiangleev/badmatch:server-latest
    environment:
      DATABASE_URL: postgresql+asyncpg://badminton:${DB_PASSWORD:-badminton}@db:5432/badminton
      # 生产环境强制要求设置随机 SECRET_KEY，未设置将无法启动
      SECRET_KEY: ${SECRET_KEY:?请在 .env 中设置 SECRET_KEY（openssl rand -hex 32 生成）}
      DEBUG: "false"
      TZ: Asia/Shanghai
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      SUPERADMIN_INIT_CODE: ${SUPERADMIN_INIT_CODE:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - ./uploads:/app/static/uploads
    depends_on:
      - db
    restart: always

  client:
    image: hsiangleev/badmatch:client-latest
    ports:
      - "${PORT:-80}:80"
    environment:
      TZ: Asia/Shanghai
    depends_on:
      - server
    restart: always

volumes:
  pgdata:
  uploads:
