services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: badminton
      POSTGRES_PASSWORD: badminton
      POSTGRES_DB: badminton
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U badminton"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    environment:
      TZ: Asia/Shanghai
    ports:
      - "6379:6379"

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://badminton:badminton@db:5432/badminton
      REDIS_URL: redis://redis:6379/0
      DEBUG: "true"
      SECRET_KEY: docker-dev-secret-key-not-for-production
      TZ: Asia/Shanghai
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./server:/app

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "3020:80"
    environment:
      TZ: Asia/Shanghai
    depends_on:
      - server

