# 开发模式：client 使用 Vite dev server，支持热更新
# 使用方式: docker compose -f docker-compose.dev.yml up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: badminton
      POSTGRES_PASSWORD: badminton
      POSTGRES_DB: badminton
      # 与生产保持一致：naive TIMESTAMP 列的写入值取决于数据库会话时区，
      # dev 不配的话会按 UTC 写入，而前端按本地时间展示 → 通知时间差 8 小时
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U badminton"]
      interval: 3s
      timeout: 3s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    # 开发模式覆盖镜像默认 CMD：保留后端热重载。
    # --timeout-graceful-shutdown 3 是必需的：uvicorn 关闭时会等已建立的连接结束
    # （包含 WebSocket），而只要浏览器或手机开着 App 就有长连接，于是改后端文件后
    # reload 会永远停在「Waiting for connections to close」，8000 端口不再响应
    # （表现为「改完代码后端就挂了」，实测踩到过）。给 3 秒上限即可正常重载。
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload --timeout-graceful-shutdown 3
    environment:
      DATABASE_URL: postgresql+asyncpg://badminton:badminton@db:5432/badminton
      DEBUG: "true"
      SECRET_KEY: docker-dev-secret-key-not-for-production
      # 该密钥是公开的示例值，明确声明后才允许启动（生产环境不要设置这一项）
      ALLOW_INSECURE_SECRET_KEY: "true"
      # 本地开发固定初始注册码。不配这一项时：那串码是「第一次有人提交注册请求」
      # 才随机生成并打到日志里的，而 dev 容器开了 --reload —— 改一行后端代码就重载、
      # 换一个新码，于是经常出现「照着日志填还是不对」。
      # 生产环境绝不要照抄这一行（生产请在 .env 里配自己的值或不配）。
      SUPERADMIN_INIT_CODE: ${SUPERADMIN_INIT_CODE:-dev-superadmin}
      TZ: Asia/Shanghai
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./server:/app

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      API_HOST: server
    depends_on:
      - server
    volumes:
      - ./client/src:/app/src

volumes:
  pgdata:
