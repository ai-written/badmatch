# 开发模式：client 使用 Vite dev server，支持热更新
# 使用方式: docker compose -f docker-compose.dev.yml up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: badminton
      POSTGRES_PASSWORD: badminton
      POSTGRES_DB: badminton
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U badminton"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://badminton:badminton@db:5432/badminton
      REDIS_URL: redis://redis:6379/0
      DEBUG: "true"
      SECRET_KEY: docker-dev-secret-key-not-for-production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./server:/app

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      API_HOST: server
    depends_on:
      - server
    volumes:
      - ./client/src:/app/src

volumes:
  pgdata:
