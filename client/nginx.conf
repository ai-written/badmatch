# ---- 基础限流（http 级，本文件被 include 进 conf.d，属于 http 上下文）----
# 目的：把扫描器/爆破的连打挡在门卫层（应用里按账号/按 IP 的限流照旧保留）。
# 关键点：一律用 nodelay —— 令牌桶耗尽时**直接回 429**，而不是把请求排队。
# 排队等待才会让正常用户觉得「卡」；拒绝只落在异常流量上。
#
# 额度怎么定的（球馆一个 WiFi 出去就是**一个公网 IP**，十几个人共用一份额度）：
#   · 一个页面首屏 ≈ 2~3 个 /api 请求（页面数据 ± /auth/me），静态资源走 /assets/ 不限流；
#     之后几乎不再请求：记分页每 30s 一次校准，WebSocket 心跳走长连接不算新请求。
#   · 15 人同一秒冷启动 ≈ 30~45 个请求；30 人 ≈ 60~90 个。
#   所以 /api/ 取 30r/s + burst 200：冷启动（含同时翻页、下拉刷新）一次吃掉也不会被拒；
#   而持续 30r/s 对扫描器/爆破仍然是硬顶（它们早就被上面的 444 掐掉了大半）。
#   注意 $binary_remote_addr 必须是**真实客户端 IP** 才谈得上"按 IP"：
#   公网直连部署务必先按 README 关掉 Docker 的 userland-proxy，否则所有人共用
#   一个 172.27.0.1，这几个额度就变成"全群共享"了。
limit_req_zone $binary_remote_addr zone=badmatch_spa:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=badmatch_api:10m rate=30r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    # ---- 真实客户端 IP ----
    # 当前部署：浏览器 → 公网 IP:${PORT} → 本容器(nginx) → server 容器，**中间没有代理**。
    # 因此这里刻意**不启用 realip**：
    # 1. 直连时 $remote_addr 就是访客公网 IP，下面 proxy_set_header X-Real-IP $remote_addr
    #    写的已经是真实值；
    # 2. 一旦启用 realip 并信任私有网段（172.16/12 等），能连到本端口的人自带一个
    #    CF-Connecting-IP / X-Forwarded-For 就能把来源"伪装"成任意地址，按 IP 的限流
    #    与审计跟着失效（这正是早期为 Cloudflare Tunnel 写的那套配置的副作用）。
    #
    # ⚠️ 前置条件：Docker 默认开着 userland-proxy，发布端口的连接会被改写成
    # 网桥网关（日志里全是 172.27.0.1）。宿主 /etc/docker/daemon.json 里加
    #   { "userland-proxy": false }
    # 后 `systemctl restart docker`，容器才能看到真实公网 IP（详见 README「真实客户端 IP」）。
    #
    # 如果以后在前面加了代理，按对应拓扑**二选一**打开（信任段只留该代理的地址段）：
    #   · 宿主机 nginx 回源：real_ip_header X-Real-IP;  set_real_ip_from <宿主/网桥网段>;
    #   · 腾讯云 CLB 回源： real_ip_header X-Forwarded-For; real_ip_recursive on;
    #   · Cloudflare：      real_ip_header CF-Connecting-IP; set_real_ip_from <CF 网段>;
    #                      （网段表见 https://www.cloudflare.com/ips-v4）
    # 并且此时必须把 client 端口限制为只允许该代理回源（安全组 / 绑定 127.0.0.1）。

    # 限流命中时回一个 JSON（前端拦截器会把它当 detail 弹成「操作太频繁，请稍候再试」），
    # 而不是 nginx 默认的 HTML 错误页 —— 那样前端拿不到 detail，用户只看到"数据没出来"
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        return 429 '{"detail":"操作太频繁，请稍候再试"}';
    }

    # ---- 拦掉扫描器常探的路径 ----
    # 僵尸网络每天都会扫 /.env、/.git/config、/wp-admin、/phpmyadmin …
    # 这里直接断连（444 = 不回任何内容），并且 access_log off：不写 nginx 日志，
    # 也不去打扰后端（后端本来也只会回 404）。正则 location 优先于 /api/ 前缀，
    # 所以 /api/.env、/api/v1/.env 这类也会被这里拦住。
    location ~* (^|/)\.(env|git|svn|hg|aws|ssh|htaccess|htpasswd|DS_Store|idea|vscode)(\.|/|$) {
        access_log off;
        return 444;
    }
    location ~* ^/(wp-admin|wp-login\.php|wp-content|xmlrpc\.php|phpmyadmin|phpinfo\.php|administrator|actuator|solr|console|server-status|vendor/phpunit) {
        access_log off;
        return 444;
    }

    root /usr/share/nginx/html;
    index index.html;

    # ---- gzip 压缩（低带宽服务器核心优化）----
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_vary on;
    # 允许压缩反代（API）响应
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/javascript
        application/xml
        text/xml
        image/svg+xml;

    # ---- 静态资源缓存 ----
    # 带内容 hash 的构建产物：长缓存 + immutable（文件名变了即新资源）。
    # 这一层**刻意不限流**：一次打开页面会连取十几个 js/css，15 人同时冷启动就是 200+ 个请求，
    # 一旦在这里排队/拒绝，页面会直接白屏（缺 js）。带宽靠 immutable 缓存兜底，不是靠限流。
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # favicon / 站点图标缓存
    location = /favicon.png {
        expires 7d;
        add_header Cache-Control "public";
    }

    # SPA 入口：不缓存，保证每次拿到最新 index.html
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        # 页面导航本身很稀疏（一次打开 1 个），给足突发即可
        limit_req zone=badmatch_spa burst=120 nodelay;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        # 见文件头部的额度推算：十几人共用同一个公网 IP（球馆 WiFi）也能一次吃掉冷启动；
        # 超了直接 429（不排队），所以正常用户不会因此变慢
        limit_req zone=badmatch_api burst=200 nodelay;
        proxy_pass http://server:8000;
        proxy_set_header Host $host;
        # 用 $remote_addr 覆盖式写入：客户端自带的伪造值会被冲掉。
        # 服务端默认不信任转发头（TRUST_PROXY_HEADERS=false），
        # 只有在确认「服务仅能被本代理回源」时才可开启信任（prod compose 已开）。
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 始终清空：本部署前面没有 Cloudflare，留着只会被用来伪造来源
        proxy_set_header CF-Connecting-IP "";
    }

    location /ws/ {
        # WebSocket 长连接（连接建立后不再有新请求），不参与限流
        proxy_pass http://server:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        # WebSocket 长连接：默认 60s 会掐断空闲连接（表现为反复重连）。
        # 服务端现已回应应用层 pong，这里再放宽超时做双保险。
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /static/ {
        proxy_pass http://server:8000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }
}
