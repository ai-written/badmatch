server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- gzip 压缩（低带宽服务器核心优化）----
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_vary on;
    # 允许压缩反代（API）响应
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/javascript
        application/xml
        text/xml
        image/svg+xml;

    # ---- 静态资源缓存 ----
    # 带内容 hash 的构建产物：长缓存 + immutable（文件名变了即新资源）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # favicon / 站点图标缓存
    location = /favicon.png {
        expires 7d;
        add_header Cache-Control "public";
    }

    # SPA 入口：不缓存，保证每次拿到最新 index.html
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://server:8000;
        proxy_set_header Host $host;
        # 用 $remote_addr 覆盖式写入：客户端自带的伪造值会被冲掉。
        # 服务端默认不信任转发头（TRUST_PROXY_HEADERS=false），
        # 只有在确认「服务仅能被本代理回源」时才可开启信任。
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 非 Cloudflare 回源时必须清空，避免被伪造后误当作真实来源
        proxy_set_header CF-Connecting-IP "";
    }

    location /ws/ {
        proxy_pass http://server:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        # WebSocket 长连接：默认 60s 会掐断空闲连接（表现为反复重连）。
        # 服务端现已回应应用层 pong，这里再放宽超时做双保险。
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /static/ {
        proxy_pass http://server:8000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }
}
