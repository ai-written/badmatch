server {
    listen 80;
    server_name _;

    # ---- 真实客户端 IP 还原 ----
    # 链路：浏览器 → Cloudflare → cloudflared（跑在宿主机上）→ 本容器 → server 容器。
    # cloudflared 从宿主机回源，本容器看到的 $remote_addr 是 Docker 网桥网关
    # （实测 172.27.0.1）而不是访客；不还原的话下面 proxy_set_header X-Real-IP
    # 写进去的就是这个网关地址，后端的审计/访问日志与按 IP 的限流会把所有访客
    # 算成同一个人（登录失败 30 次/10 分钟的那把锁会连坐整个群）。
    # CF 在边缘会把真实客户端写入 CF-Connecting-IP，并**覆盖**客户端自带的同名头，
    # 因此它比 X-Forwarded-For（只追加，客户端可预置伪造值）更可靠。
    # 只信任私有地址段（含回环），而不是某一个具体网段：
    # Docker 默认池从 172.17.0.0/16 依次分配到 172.31.0.0/16（均属 172.16.0.0/12），
    # 池用尽时退到 192.168.0.0/16，自定义网络常用 10.0.0.0/8。
    # 于是 cloudflared 无论跑在宿主机、同网络容器，还是以后换了 Docker 网络，
    # 回源地址都落在信任范围内，这一行不需要再维护。
    # 【前提】client 端口必须只绑定回环（127.0.0.1:19334:80），或用防火墙只放行
    # 隧道来源：否则同内网的机器能直连本端口并自带伪造的 CF-Connecting-IP，把来源
    # 伪装成任意地址（按 IP 的限流与审计随之失效）。
    # 公网直连不在此列：源地址是公网 IP，不在信任段内，realip 不会采信它。
    # 备选：若隧道未透传 CF-Connecting-IP，改用下面两行（实测 XFF 里已是真实 IP）
    #   real_ip_header   X-Forwarded-For;
    #   real_ip_recursive on;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header   CF-Connecting-IP;

    root /usr/share/nginx/html;
    index index.html;

    # ---- gzip 压缩（低带宽服务器核心优化）----
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_vary on;
    # 允许压缩反代（API）响应
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/javascript
        application/xml
        text/xml
        image/svg+xml;

    # ---- 静态资源缓存 ----
    # 带内容 hash 的构建产物：长缓存 + immutable（文件名变了即新资源）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # favicon / 站点图标缓存
    location = /favicon.png {
        expires 7d;
        add_header Cache-Control "public";
    }

    # SPA 入口：不缓存，保证每次拿到最新 index.html
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://server:8000;
        proxy_set_header Host $host;
        # 用 $remote_addr 覆盖式写入：客户端自带的伪造值会被冲掉。
        # 服务端默认不信任转发头（TRUST_PROXY_HEADERS=false），
        # 只有在确认「服务仅能被本代理回源」时才可开启信任。
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 非 Cloudflare 回源时必须清空，避免被伪造后误当作真实来源
        proxy_set_header CF-Connecting-IP "";
    }

    location /ws/ {
        proxy_pass http://server:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        # WebSocket 长连接：默认 60s 会掐断空闲连接（表现为反复重连）。
        # 服务端现已回应应用层 pong，这里再放宽超时做双保险。
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /static/ {
        proxy_pass http://server:8000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }
}
